server.port=8080

# H2 database stored in ./data (delete that folder to re-seed from DataSeeder)
spring.datasource.url=jdbc:h2:file:./data/ctprdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# To use MySQL instead, add the mysql-connector-j dependency and set:
# spring.datasource.url=jdbc:mysql://localhost:3306/ctpr
# spring.datasource.username=root
# spring.datasource.password=yourpassword
